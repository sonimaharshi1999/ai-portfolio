<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="maskClip">
      <path d="M300 40
               C 420 40, 500 100, 520 220
               C 535 310, 520 420, 470 520
               C 430 600, 365 655, 300 660
               C 235 655, 170 600, 130 520
               C 80 420, 65 310, 80 220
               C 100 100, 180 40, 300 40 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#maskClip)">
    <!-- base red fill -->
    <rect x="0" y="0" width="600" height="700" fill="#C81E2C"/>

    <!-- blue side panels (temples / jaw sides) -->
    <path d="M80 220 C 65 310, 80 420, 130 520 C 150 560, 175 590, 205 615
             L 150 600 C 105 555, 75 470, 70 380 C 66 320, 68 265, 80 220 Z" fill="#1B4F9C"/>
    <path d="M520 220 C 535 310, 520 420, 470 520 C 450 560, 425 590, 395 615
             L 450 600 C 495 555, 525 470, 530 380 C 534 320, 532 265, 520 220 Z" fill="#1B4F9C"/>

    <!-- blue top corners -->
    <path d="M300 40 C 230 40, 165 80, 130 150 L 110 130 C 150 75, 220 42, 300 40 Z" fill="#1B4F9C"/>
    <path d="M300 40 C 370 40, 435 80, 470 150 L 490 130 C 450 75, 380 42, 300 40 Z" fill="#1B4F9C"/>

    <!-- web pattern: radiating lines from center top -->
    <g stroke="#111111" stroke-width="3" fill="none" opacity="0.85">
      <line x1="300" y1="55" x2="300" y2="660"/>
      <line x1="300" y1="60" x2="140" y2="260"/>
      <line x1="300" y1="60" x2="460" y2="260"/>
      <line x1="300" y1="60" x2="95" y2="400"/>
      <line x1="300" y1="60" x2="505" y2="400"/>
      <line x1="300" y1="60" x2="180" y2="560"/>
      <line x1="300" y1="60" x2="420" y2="560"/>
      <line x1="300" y1="60" x2="60" y2="230"/>
      <line x1="300" y1="60" x2="540" y2="230"/>
    </g>

    <!-- web pattern: concentric arcs -->
    <g stroke="#111111" stroke-width="3" fill="none" opacity="0.85">
      <path d="M115 150 C 200 110, 400 110, 485 150"/>
      <path d="M85 260 C 210 195, 390 195, 515 260"/>
      <path d="M72 370 C 210 290, 390 290, 528 370"/>
      <path d="M90 480 C 215 400, 385 400, 510 480"/>
      <path d="M140 570 C 230 510, 370 510, 460 570"/>
      <path d="M195 630 C 250 590, 350 590, 405 630"/>
    </g>
  </g>

  <!-- mask outline -->
  <path d="M300 40
           C 420 40, 500 100, 520 220
           C 535 310, 520 420, 470 520
           C 430 600, 365 655, 300 660
           C 235 655, 170 600, 130 520
           C 80 420, 65 310, 80 220
           C 100 100, 180 40, 300 40 Z"
        fill="none" stroke="#111111" stroke-width="6"/>

  <!-- LEFT EYE (angular white lens) -->
  <path d="M170 300
           L 210 245
           L 262 262
           L 285 320
           L 268 385
           L 218 405
           L 178 368
           L 158 330
           Z"
        fill="#F5F5F0" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- RIGHT EYE (angular white lens, mirrored) -->
  <path d="M430 300
           L 390 245
           L 338 262
           L 315 320
           L 332 385
           L 382 405
           L 422 368
           L 442 330
           Z"
        fill="#F5F5F0" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- inner eye shading for depth -->
  <path d="M182 310 L 214 265 L 250 278 L 268 322 L 254 370 L 216 386 L 188 358 Z"
        fill="#E3E3DC" opacity="0.6"/>
  <path d="M418 310 L 386 265 L 350 278 L 332 322 L 346 370 L 384 386 L 412 358 Z"
        fill="#E3E3DC" opacity="0.6"/>
</svg>
