name: Auto-Update Portfolio

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run portfolio update script
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          python scripts/scan_and_update.py
      
      - name: Commit and push changes
        run: |
          git config user.name "Portfolio Bot"
          git config user.email "portfolio-bot@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "🤖 Auto-update: Portfolio regenerated" && git push)
