<svg width="600" height="900" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="headClip">
      <path d="M300,40
               C 360,40 405,80 415,140
               C 423,185 408,225 378,252
               C 352,275 326,285 300,286
               C 274,285 248,275 222,252
               C 192,225 177,185 185,140
               C 195,80 240,40 300,40 Z"/>
    </clipPath>
  </defs>

  <!-- ===== LEGS (drawn first, behind torso) ===== -->
  <rect x="205" y="575" width="90" height="210" rx="30" fill="#1B4F9C"/>
  <rect x="305" y="575" width="90" height="210" rx="30" fill="#1B4F9C"/>
  <!-- boots -->
  <path d="M195 760 L 305 760 L 315 800 C 316 820 300 838 260 838 C 210 838 190 822 190 800 Z" fill="#C81E2C"/>
  <path d="M295 760 L 405 760 L 410 800 C 410 822 390 838 340 838 C 300 838 284 820 285 800 Z" fill="#C81E2C"/>

  <!-- ===== BELT ===== -->
  <rect x="220" y="555" width="160" height="40" rx="12" fill="#161616"/>

  <!-- ===== TORSO ===== -->
  <path d="M170 335
           C 150 340, 140 380, 150 430
           C 158 480, 175 520, 205 555
           L 395 555
           C 425 520, 442 480, 450 430
           C 460 380, 450 340, 430 335
           C 400 315, 340 305, 300 305
           C 260 305, 200 315, 170 335 Z"
        fill="#C81E2C"/>
  <!-- torso side (blue) panels -->
  <path d="M170 335 C 150 340, 140 380, 150 430 C 156 468, 168 500, 188 528
           L 220 500 C 202 470, 192 440, 190 405 C 189 375, 195 350, 210 335
           C 195 335, 180 335, 170 335 Z" fill="#1B4F9C"/>
  <path d="M430 335 C 450 340, 460 380, 450 430 C 444 468, 432 500, 412 528
           L 380 500 C 398 470, 408 440, 410 405 C 411 375, 405 350, 390 335
           C 405 335, 420 335, 430 335 Z" fill="#1B4F9C"/>

  <!-- chest web accent (minimal) -->
  <g stroke="#161616" stroke-width="3" fill="none" opacity="0.75">
    <line x1="300" y1="308" x2="300" y2="420"/>
    <path d="M240 335 C 265 355, 335 355, 360 335"/>
    <path d="M215 400 C 260 375, 340 375, 385 400"/>
  </g>

  <!-- neck -->
  <rect x="272" y="278" width="56" height="45" rx="10" fill="#C81E2C"/>

  <!-- ===== SHOULDER CAPS ===== -->
  <circle cx="172" cy="345" r="46" fill="#1B4F9C"/>
  <circle cx="428" cy="345" r="46" fill="#1B4F9C"/>

  <!-- ===== ARMS CROSSED ===== -->
  <!-- back arm (character's right arm, crossing to viewer-left) -->
  <line x1="428" y1="345" x2="205" y2="452" stroke="#1B4F9C" stroke-width="66" stroke-linecap="round"/>
  <circle cx="205" cy="452" r="36" fill="#C81E2C"/>

  <!-- front arm (character's left arm, crossing to viewer-right, drawn on top) -->
  <line x1="172" y1="345" x2="395" y2="452" stroke="#1B4F9C" stroke-width="66" stroke-linecap="round"/>
  <circle cx="395" cy="452" r="36" fill="#C81E2C"/>

  <!-- small glove web lines -->
  <g stroke="#161616" stroke-width="2.5" opacity="0.7">
    <line x1="192" y1="440" x2="218" y2="464"/>
    <line x1="382" y1="440" x2="408" y2="464"/>
  </g>

  <!-- ===== HEAD / MASK ===== -->
  <g clip-path="url(#headClip)">
    <rect x="140" y="30" width="330" height="270" fill="#C81E2C"/>
    <path d="M185 140 C 177 185, 192 225, 222 252 C 208 258, 196 262, 186 264
             C 165 235, 155 195, 160 155 C 168 148, 176 143, 185 140 Z" fill="#1B4F9C"/>
    <path d="M415 140 C 423 185, 408 225, 378 252 C 392 258, 404 262, 414 264
             C 435 235, 445 195, 440 155 C 432 148, 424 143, 415 140 Z" fill="#1B4F9C"/>
  </g>
  <path d="M300,40
           C 360,40 405,80 415,140
           C 423,185 408,225 378,252
           C 352,275 326,285 300,286
           C 274,285 248,275 222,252
           C 192,225 177,185 185,140
           C 195,80 240,40 300,40 Z"
        fill="none" stroke="#161616" stroke-width="5"/>

  <!-- eyes -->
  <path d="M235 165 L 262 138 L 296 150 L 308 185 L 297 220 L 265 233 L 240 205 L 228 182 Z"
        fill="#F5F5F0" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
  <path d="M365 165 L 338 138 L 304 150 L 292 185 L 303 220 L 335 233 L 360 205 L 372 182 Z"
        fill="#F5F5F0" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
</svg>
