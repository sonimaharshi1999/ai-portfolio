<svg width="500" height="680" viewBox="0 0 500 680" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="headClip2">
      <path d="M250,380
               C 310,380 355,420 365,480
               C 373,525 358,565 328,592
               C 302,615 276,625 250,626
               C 224,625 198,615 172,592
               C 142,565 127,525 135,480
               C 145,420 190,380 250,380 Z"/>
    </clipPath>
  </defs>

  <!-- ===== WEB THREAD ===== -->
  <line x1="250" y1="0" x2="257" y2="30" stroke="#555555" stroke-width="2.5"/>
  <line x1="257" y1="30" x2="251" y2="58" stroke="#555555" stroke-width="2.5"/>
  <line x1="251" y1="58" x2="257" y2="88" stroke="#555555" stroke-width="2.5"/>

  <!-- ===== LEG A (bent up, foot near thread) ===== -->
  <polyline points="280,190 300,120 265,85" fill="none" stroke="#1B4F9C" stroke-width="50"
            stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="257" cy="76" rx="28" ry="20" fill="#C81E2C"/>

  <!-- ===== LEG B (relaxed, bent to the side) ===== -->
  <polyline points="220,190 170,300 200,380" fill="none" stroke="#1B4F9C" stroke-width="50"
            stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="205" cy="396" rx="30" ry="22" fill="#C81E2C"/>

  <!-- ===== TORSO ===== -->
  <path d="M220,170 C 210,200 205,240 210,270
           L 170,300 C 175,322 190,336 210,342
           L 290,342 C 310,336 325,322 330,300
           L 290,270 C 295,240 290,200 280,170 Z"
        fill="#C81E2C"/>
  <path d="M210,270 L 170,300 C 175,322 190,336 210,342 L 235,342
           C 222,320 212,296 210,270 Z" fill="#1B4F9C"/>
  <path d="M290,270 L 330,300 C 325,322 310,336 290,342 L 265,342
           C 278,320 288,296 290,270 Z" fill="#1B4F9C"/>

  <!-- torso web accent (minimal) -->
  <g stroke="#161616" stroke-width="3" fill="none" opacity="0.75">
    <line x1="250" y1="182" x2="250" y2="300"/>
    <path d="M225 300 C 240 315, 260 315, 275 300"/>
  </g>

  <!-- neck -->
  <rect x="228" y="335" width="44" height="40" rx="10" fill="#C81E2C"/>

  <!-- ===== SHOULDERS + ARMS (playful open pose) ===== -->
  <circle cx="188" cy="322" r="38" fill="#1B4F9C"/>
  <circle cx="312" cy="322" r="38" fill="#1B4F9C"/>

  <line x1="188" y1="322" x2="95" y2="410" stroke="#1B4F9C" stroke-width="56" stroke-linecap="round"/>
  <circle cx="95" cy="410" r="32" fill="#C81E2C"/>

  <line x1="312" y1="322" x2="405" y2="410" stroke="#1B4F9C" stroke-width="56" stroke-linecap="round"/>
  <circle cx="405" cy="410" r="32" fill="#C81E2C"/>

  <!-- small glove web lines -->
  <g stroke="#161616" stroke-width="2.5" opacity="0.7">
    <line x1="105" y1="392" x2="122" y2="415"/>
    <line x1="395" y1="392" x2="378" y2="415"/>
  </g>

  <!-- ===== HEAD / MASK (hanging at bottom) ===== -->
  <g clip-path="url(#headClip2)">
    <rect x="90" y="370" width="330" height="270" fill="#C81E2C"/>
    <path d="M135,480 C127,525, 142,565, 172,592 C158,598, 146,602, 136,604
             C115,575, 105,535, 110,495 C118,488, 126,483, 135,480 Z" fill="#1B4F9C"/>
    <path d="M365,480 C373,525, 358,565, 328,592 C342,598, 354,602, 364,604
             C385,575, 395,535, 390,495 C382,488, 374,483, 365,480 Z" fill="#1B4F9C"/>
  </g>
  <path d="M250,380
           C 310,380 355,420 365,480
           C 373,525 358,565 328,592
           C 302,615 276,625 250,626
           C 224,625 198,615 172,592
           C 142,565 127,525 135,480
           C 145,420 190,380 250,380 Z"
        fill="none" stroke="#161616" stroke-width="5"/>

  <!-- eyes -->
  <path d="M185,505 L212,478 L246,490 L258,525 L247,560 L215,573 L190,545 L178,522 Z"
        fill="#F5F5F0" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
  <path d="M315,505 L288,478 L254,490 L242,525 L253,560 L285,573 L310,545 L322,522 Z"
        fill="#F5F5F0" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
</svg>
